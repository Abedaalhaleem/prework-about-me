# WiFi RoomSense 3D: example configuration.
#
# Copy to configs/roomsense.toml (git-ignored) and edit it. Every key is optional.
# The defaults are in backend/roomsense/config.py. Changing anything in
# [processing] or [detection] changes the config version recorded on every
# output, and it invalidates calibrations made under the old version.
#
# Secrets never go in this file. For LAN exposure, set the environment
# variable ROOMSENSE_API_TOKEN (at least 16 characters) and allow_non_loopback = true.

[server]
host = "127.0.0.1"          # loopback only by default
port = 8765
allow_non_loopback = false  # also requires ROOMSENSE_API_TOKEN; never expose publicly
websocket_push_hz = 4.0     # UI refresh of status; NOT the sensor update rate

[storage]
data_dir = "data"                    # relative to the repository root
max_recording_bytes = 200_000_000    # per recording (compressed)
max_recording_seconds = 3600.0
max_total_recording_bytes = 2_000_000_000
keep_raw_lines = true                # keep each raw serial line with the frame, for debugging

[acquisition]
expected_rate_hz = 25.0     # the configured ping/transmit rate; the measured rate is reported separately
stale_after_s = 2.0         # no frames for this long => SENSOR_OFFLINE for that link
max_line_bytes = 8192
alignment_tolerance_s = 0.25

# One [[acquisition.receivers]] block per ESP32 receiver on USB. The serial port is
# never guessed: list the ports with `roomsense ports` or in the UI.
#
# RoomSense firmware (firmware/esp32/roomsense_csi_rx) in ESP-NOW mode, with the
# RoomSense transmitter (firmware/esp32/roomsense_csi_tx):
[[acquisition.receivers]]
receiver_id = "rx1"
port = "/dev/ttyUSB0"                 # macOS: /dev/cu.usbserial-XXXX  Windows: COM5
baud = 921600
input_format = "roomsense-rscsi-v1"
transmitter_id = "tx1"
transmitter_mac = "1a:00:00:00:00:00" # must match CONFIG_RS_TX_MAC on the transmitter
declared_board = "ESP32-S3-DevKitC-1U" # what you plugged in (user-declared; the firmware reports the chip)

# Unmodified Espressif esp-csi csi_recv_router firmware on an ESP32-S3 (upstream
# format; no hello line, so you must declare the chip and the CSI config):
# [[acquisition.receivers]]
# receiver_id = "rx_router"
# port = "/dev/ttyUSB1"
# input_format = "esp-csi-upstream-classic-v1"
# transmitter_id = "router"
# transmitter_mac = "aa:bb:cc:dd:ee:ff"   # your router's BSSID, as printed by the firmware
# declared_chip = "esp32s3"
# ltf_config = "lltf_only"

[processing]
window_s = 2.0
hop_s = 0.5
min_frames_per_window = 20
max_gap_s = 0.25            # windows are split at longer gaps; there is no interpolation across them
hampel_window = 5
hampel_sigmas = 3.0
min_valid_subcarrier_fraction = 0.6
use_phase = false           # phase is not used until it has been validated for this hardware

[detection]
enter_threshold = 4.0       # robust z-score vs the quiet baseline (heuristic, not a probability)
exit_threshold = 2.5        # must be < enter_threshold (hysteresis)
min_motion_hold_s = 2.0
min_quiet_hold_s = 3.0
baseline_min_duration_s = 60.0
baseline_min_windows = 30
clear_stale_after_s = 5.0   # clear detections after the data is this old
min_quality_for_decision = "DEGRADED"
drift_min_profile_correlation = 0.8
drift_hold_s = 30.0

[zone]
criteria_file = "configs/zone_enablement.toml"   # predefined; see CALIBRATION.md
min_receivers = 3

[pose]
manifest_file = "configs/pose_model_manifest.json"

[room]
geometry_file = "data/room.json"    # made by the calibration wizard (USER PROVIDED)
