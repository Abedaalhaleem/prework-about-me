[project]
name = "roomsense"
version = "0.1.0"
description = "WiFi RoomSense 3D - local, experimental Wi-Fi CSI acquisition, motion detection and gated zone estimation"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    # uvicorn needs a WebSocket implementation to serve /api/ws (the UI's live view).
    "websockets>=13.0,<17.0",
    "pydantic>=2.8,<3.0",
    "numpy>=1.26,<3.0",
    "scipy>=1.13,<2.0",
    "scikit-learn>=1.5,<2.0",
    "pyserial>=3.5,<4.0",
    "joblib>=1.4,<2.0",
    # macOS only: read this Mac's own Wi-Fi signal strength (RSSI) for the
    # "My Wi-Fi signal" page. Never used for CSI or motion detection.
    "pyobjc-framework-CoreWLAN>=11.0,<13.0; sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
    "pytest>=8.2,<9.0",
    "httpx>=0.27,<1.0",
]

[project.scripts]
roomsense = "roomsense.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["roomsense"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: longer-running tests (still synthetic; never hardware)",
]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
]
